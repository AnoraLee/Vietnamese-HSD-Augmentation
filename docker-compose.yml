services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hsd-backend:latest
    container_name: hsd-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HSD_PROJECT_DIR: /app
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      HF_HOME: /app/.cache/huggingface
    volumes:
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  hf_cache: